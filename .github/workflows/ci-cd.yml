name: CI

# Проверка запускается на каждой ветке. Прежде она ждала веток main и
# develop, которых в репозитории нет (основная — master), и за всё время
# не сработала ни разу: месяц работы прошёл без единой сборки.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

# Новый пуш в ту же ветку отменяет прежнюю проверку: её итог уже не нужен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Тесты · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Продукт живёт на Windows и разрабатывается на Python 3.13;
        # Linux — то, на чём он поедет в контейнере. Прежняя матрица из
        # девяти заданий проверяла три версии на трёх системах, из
        # которых macOS и Python 3.10 никто не использует.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Окружение для тестов
        shell: bash
        run: |
          {
            echo "HH_USER_EMAIL=test@example.com"
            echo "API_REQUEST_DELAY=0.1"
            echo "MAX_PAGES=2"
            echo "DAYS_BACK=7"
          } > .env

      # Только то, что ломает работу: синтаксис, неизвестные имена,
      # переменная до присваивания. Именно так нашёлся эндпоинт, который
      # падал на каждом вызове. Стиль этим шагом не проверяется.
      - name: Линтер · ошибки, а не стиль
        run: ruff check . --select E9,F63,F7,F82 --exclude frontend,data

      - name: Тесты
        run: pytest tests/ -q --cov=src --cov=web --cov-report=term-missing:skip-covered

  frontend:
    name: Интерфейс · сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  release:
    name: Выпуск
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
